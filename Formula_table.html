<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Table</title>
</head>

<body>
    <table border="1" cellspacing="0" cellpadding="5" align="center">
        <caption>
            <h4>3D Shapes</h4>
        </caption>
        <thead>
            <tr>
                <th>Name of the solid</th>
                <th>Figure</th>
                <th>Volume</th>
                <th>Lateral/Curved surface area</th>
                <th>Total surface area</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Cuboid</td>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDGfrsurANiA8iV_VamGumvEjBxTeUPVye6asoOcHqfA&s=10"
                        height="60" width="80" alt="cuboid"></td>
                <td>lbh</td>
                <td>2h(l+b)</td>
                <td>2(lb+bh+hl)</td>
            </tr>
            <tr>
                <td>Cube</td>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpLwgKMb3ixi0SYpHa4N9-j8yzAKfR3544q3OTRMBp8Q&s=10"
                        height="60" width="80" alt="cube"></td>
                <td>a<sup>3</sup></td>
                <td>4a<sup>2</sup></td>
                <td>6a<sup>2</sup></td>
            </tr>
            <tr>
                <td>Right Circular Cylinder</td>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTeXO-7oTKCrplML7EhCIwmrhuJv_q6sKenEvc7LSw1&s=10"
                        height="60" width="80" alt="Right Circular Cylinder"></td>
                <td>&pi;r<sup>2</sup>h</td>
                <td>2&pi;rh</td>
                <td>2&pi;r(r + h)</td>
            </tr>
            <tr>
                <td>Right Circular Cone</td>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZsPmzXFcjnw8geiiJFShsMn8GRBfzgb0zrOj0gudEgQ&s=10"
                        height="60" width="80" alt="Right Circular Cone"></td>
                <td>
                    <sup>1</sup>&frasl;<sub>3</sub>&pi;r<sup>2</sup>h
                </td>
                <td>&pi;rl</td>
                <td>&pi;r(l + r)</td>
            </tr>
            <tr>
                <td>Sphere</td>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnRjX48WOdtwBfWLsCn3SSsmOQNLSL2387xfrhZEq0OA&s=10"
                        height="60" width="80" alt="Sphere"></td>
                <td>
                    <sup>4</sup>&frasl;<sub>3</sub>&pi;r<sup>3</sup>
                </td>
                <td>4&pi;r<sup>2</sup></td>
                <td>4&pi;r<sup>2</sup></td>
            </tr>
            <tr>
                <td>Hemisphere</td>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWRXxxNFklSdNzxMSeg8pZDNoQ_2JhbbZpQiI2cZ9ADA&s=10"
                        height="60" width="80" alt="Hemisphere"></td>
                <td>
                    <sup>2</sup>&frasl;<sub>3</sub>&pi;r<sup>3</sup>
                </td>
                <td>2&pi;r<sup>2</sup></td>
                <td>3&pi;r<sup>2</sup></td>
            </tr>

        </tbody>
    </table>
</body>

</html>
